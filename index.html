<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mess Menu - IIITDM Kurnool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-title">Mess Menu</div>
      <div class="header-subtitle">IIITDM Kurnool</div>
    </header>

    <nav class="days-nav" aria-label="Weekday selection">
      <div class="days-scroll" id="daysContainer">
        <button type="button" class="day-btn" data-day="monday">Monday</button>
        <button type="button" class="day-btn" data-day="tuesday">Tuesday</button>
        <button type="button" class="day-btn" data-day="wednesday">Wednesday</button>
        <button type="button" class="day-btn" data-day="thursday">Thursday</button>
        <button type="button" class="day-btn" data-day="friday">Friday</button>
        <button type="button" class="day-btn" data-day="saturday">Saturday</button>
        <button type="button" class="day-btn" data-day="sunday">Sunday</button>
      </div>
    </nav>

    <section class="controls-bar">
      <h1 class="current-selection-title" id="menuTitle">Monday Menu</h1>
      <div class="mess-toggle" role="group" aria-label="Mess switch">
        <button type="button" class="mess-btn" id="messBBtn" data-mess="B">Mess B</button>
        <button type="button" class="mess-btn" id="messABtn" data-mess="A">Mess A</button>
      </div>
    </section>

    <main class="menu-sections" id="menuSections">
      <!-- Dynamically rendered meals -->
    </main>
  </div>

  <script src="database.js"></script>
  <script src="script.js"></script>
</body>
</html>
