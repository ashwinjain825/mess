<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bhati Mess - Moved to New URL</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta http-equiv="refresh" content="5; url=https://bhati-mess.web.app">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7f8f9;
      color: #1f2937;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      max-width: 440px;
      width: 100%;
      padding: 28px 24px;
      text-align: center;
    }

    .header-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6b7280;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      padding: 3px 10px;
      border-radius: 9999px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
    }

    p.desc {
      font-size: 0.9rem;
      color: #4b5563;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .url-badge {
      display: block;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      padding: 10px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
      font-weight: 600;
      color: #1f2937;
      text-decoration: none;
      margin-bottom: 18px;
      transition: background 0.15s ease, border-color 0.15s ease;
      word-break: break-all;
    }

    .url-badge:hover {
      background: #f3f4f6;
      border-color: #cbd5e1;
    }

    .countdown-text {
      font-size: 0.875rem;
      color: #6b7280;
      margin-bottom: 18px;
    }

    .countdown-number {
      font-weight: 700;
      color: #111827;
      font-size: 1rem;
    }

    .action-btn {
      display: block;
      width: 100%;
      background: #1f2937;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      padding: 10px 16px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .action-btn:hover {
      background: #111827;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="header-tag">Notice</span>
    <h1>Website Moved</h1>
    <p class="desc">The link for Bhati Mess is now shifted to our new official address:</p>

    <a href="https://bhati-mess.web.app" class="url-badge">
      bhati-mess.web.app
    </a>

    <div class="countdown-text">
      Redirecting in <span class="countdown-number" id="countdown">5</span> seconds...
    </div>

    <a href="https://bhati-mess.web.app" class="action-btn">
      Open Link Now
    </a>
  </div>

  <script>
    var timeLeft = 5;
    var countEl = document.getElementById("countdown");

    var timer = setInterval(function() {
      timeLeft--;
      if (countEl) {
        countEl.textContent = timeLeft;
      }
      if (timeLeft <= 0) {
        clearInterval(timer);
        window.location.href = "https://bhati-mess.web.app";
      }
    }, 1000);
  </script>
</body>
</html>
