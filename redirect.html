<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Moved - Bhati Mess</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta http-equiv="refresh" content="5; url=https://bhati-mess.web.app">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #f7f8f9;
      --surface-color: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --active-bg: #1f2937;
      --active-text: #ffffff;
      --accent-color: #2563eb;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .redirect-card {
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon-wrapper {
      width: 64px;
      height: 64px;
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      color: var(--accent-color);
    }

    .title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
      margin-bottom: 10px;
    }

    .message {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .message strong {
      color: var(--text-main);
    }

    .countdown-box {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 24px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .countdown-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      height: 32px;
      background-color: var(--active-bg);
      color: var(--active-text);
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 6px;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .pulse {
      animation: pulseAnim 0.35s ease;
    }

    @keyframes pulseAnim {
      0% { transform: scale(1); }
      50% { transform: scale(1.25); }
      100% { transform: scale(1); }
    }

    .redirect-link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 18px;
      background-color: var(--active-bg);
      color: var(--active-text);
      text-decoration: none;
      font-size: 0.925rem;
      font-weight: 600;
      border-radius: 6px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .redirect-link-btn:hover {
      background-color: #111827;
    }

    .redirect-link-btn:active {
      transform: scale(0.98);
    }

    .url-text {
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
      word-break: break-all;
    }

    .url-text a {
      color: var(--accent-color);
      text-decoration: none;
    }

    .url-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="redirect-card">
    <div class="icon-wrapper" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
    </div>

    <h1 class="title">Website Moved</h1>
    <p class="message">
      The link for <strong>Bhati Mess</strong> has officially shifted to a new web address.
    </p>

    <div class="countdown-box" aria-live="polite">
      <span>Redirecting in</span>
      <span class="countdown-number" id="countdown">5</span>
      <span>seconds...</span>
    </div>

    <a href="https://bhati-mess.web.app" class="redirect-link-btn" id="manualRedirectLink">
      <span>Go to New Website Now</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </a>

    <p class="url-text">
      Target URL: <a href="https://bhati-mess.web.app">https://bhati-mess.web.app</a>
    </p>
  </main>

  <script>
    (function() {
      const targetUrl = "https://bhati-mess.web.app";
      let timeLeft = 5;
      const countdownEl = document.getElementById("countdown");

      function updateCountdown() {
        if (countdownEl) {
          countdownEl.textContent = timeLeft;
          countdownEl.classList.remove("pulse");
          void countdownEl.offsetWidth; // trigger reflow for animation
          countdownEl.classList.add("pulse");
        }

        if (timeLeft <= 0) {
          window.location.href = targetUrl;
        } else {
          timeLeft--;
          setTimeout(updateCountdown, 1000);
        }
      }

      // Start countdown
      updateCountdown();
    })();
  </script>
</body>
</html>
